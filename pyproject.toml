[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-strategy-sandbox"
version = "0.1.0"
description = "Sandbox project for trading strategy experiments"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "David Steimel" }
]
license = "MIT"
keywords = ["trading", "strategy", "finance"]

# Direct dependencies; pip resolves their dependencies automatically.
dependencies = [
    "alpaca-py>=0.43,<1",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyarrow>=15,<25",
    "python-dotenv>=1,<2",
    "matplotlib>=3.8,<4",
    "plotly>=6,<7",
]

[project.optional-dependencies]
# Install with: python -m pip install -e ".[notebooks,dev]"
notebooks = [
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
]
# Add when starting statistical models and pairs-trading experiments.
stats = [
    "scipy>=1.12,<2",
    "statsmodels>=0.14,<0.15",
]
dev = [
    "pytest>=8,<10",
]

[project.urls]
Homepage = "https://github.com/davidsteimel/trading-strategy-sandbox"
Repository = "https://github.com/davidsteimel/trading-strategy-sandbox"

# Install trading_lab from src/; do not package the legacy src.config module.
[tool.setuptools.packages.find]
where = ["src"]
include = ["trading_lab", "trading_lab.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

